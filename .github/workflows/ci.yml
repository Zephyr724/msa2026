name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - codex/feat/**
  pull_request:
    branches:
      - main


jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Kiwimpact.slnx

      - name: Build
        run: dotnet build Kiwimpact.slnx --no-restore

      - name: Test
        run: dotnet test Kiwimpact.slnx --no-build


  frontend:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build


  production-image:
    name: Production Image Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single-origin image
        run: docker build --file Dockerfile --tag kiwimpact:ci .
