[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "/usr/local/bin/kiwimpact-entrypoint /app/migrate"
startCommand = "/usr/local/bin/kiwimpact-entrypoint dotnet Kiwimpact.Api.dll"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
requiredMountPath = "/var/lib/kiwimpact/keys"
